name: Weekly Trader Discovery

# Refreshes watchlist.json with traders who rank consistently across
# day/week/month/all-time leaderboards (not just a single snapshot).
# Runs weekly since this list shouldn't change much day to day.

on:
  schedule:
    - cron: "0 12 * * 1"  # Mondays at 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Discover consistently-ranked traders
        run: |
          python find_traders.py \
            --top-per-slice 50 \
            --min-appearances 2 \
            --show 25 \
            --watchlist watchlist.json

      - name: Commit updated watchlist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update trader watchlist [skip ci]"
          file_pattern: watchlist.json
